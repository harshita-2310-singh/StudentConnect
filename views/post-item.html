<!DOCTYPE html>
<html>
<head>
  <title>Post Item - StudentConnect</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-protected="true">
  <nav>
    <h1>StudentConnect</h1>
    <div>
      <a href="/">Marketplace</a>
      <a href="/post-item">Post Item</a>
      <a href="/profile">Profile</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="form-box">
    <h2>Post an Item</h2>
    <form id="itemForm">
      <input type="text" id="name" placeholder="Item name" required>
      <select id="category" required>
        <option value="">Select Category</option>
        <option>Books</option>
        <option>Electronics</option>
        <option>Furniture</option>
        <option>Clothing</option>
        <option>Other</option>
      </select>
      <input type="number" id="price" placeholder="Price (Rs.)" required>
      <select id="condition" required>
        <option value="">Select Condition</option>
        <option>New</option>
        <option>Like New</option>
        <option>Used</option>
      </select>
      <textarea id="description" placeholder="Description"></textarea>
      <input type="text" id="location" placeholder="Location (e.g. Hostel A)">
      <input type="text" id="imageUrl" placeholder="Image URL (Cloudinary upload comes later)">
      <button type="submit">Post Item</button>
    </form>
    <p id="message"></p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
